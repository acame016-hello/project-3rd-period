<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="signup.html">Sign Up</a>
    </nav>

    
    <h1>Create Your Account</h1>

    
    <form>
        <p><label for="fname">First Name</label><br>
        <input type="text" id="fname" placeholder="First Name">
        </p>
        <p> <label for="lname">Last Name</label><br>
        <input type="text" id="lname" placeholder="Last Name">
        </p>
        <p><label for="user-email">Email Address</label><br>
        <input type="email" id="user-email" placeholder="Email Address">
        </p>
        <p><label>Gender</label><br>
        <input type="radio" id="g-male" name="gender" value="male">
        <label for="g-male">Male</label>
        <input type="radio" id="g-female" name="gender" value="female">
        <label for="g-female">Female</label>
        </p> 
        <p><label for="user-pass">Password</label><br>
        <input type="password" id="user-pass" placeholder="Password">
    </form>

</body>
</html>
